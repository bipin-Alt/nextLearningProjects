services:
  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://authdas:local_dev_password@db:5432/authdas?schema=public"
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: authdas
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: authdas
    volumes:
      - authdas_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authdas -d authdas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  authdas_data:   